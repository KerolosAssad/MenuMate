  <script>
    async function fetchUserAndInitLocation() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/user`, { credentials: "include" });
        const data = await res.json();

        if (!data.logged_in) {
          window.location.href = "https://kerolosassad.github.io/MenuMate/";
          return;
        }

        document.getElementById("usernameDisplay").textContent = `@${data.display_name || "user"}`;
        startLocationTracking();

      } catch (err) {
        console.error("User fetch error", err);
      }
    }

    function startLocationTracking() {
      if (!navigator.geolocation) return;

      function sendLocation() {
        navigator.geolocation.getCurrentPosition(async (position) => {
          const { latitude, longitude } = position.coords;

          try {
            await fetch(`${API_BASE_URL}/api/track_location`, {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ latitude, longitude }),
            });
          } catch (err) {
            console.warn("Location send failed", err);
          }
        });
      }

      sendLocation();
      setInterval(sendLocation, 30000);
    }

    fetchUserAndInitLocation();

    document.getElementById('logoutBtn').addEventListener('click', function (e) {
      e.preventDefault();
      fetch(`${API_BASE_URL}/logout`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(response => {
        if (response.ok) {
          window.location.href = 'https://kerolosassad.github.io/MenuMate/';
        } else {
          alert('Logout failed.');
        }
      })
      .catch(err => {
        console.error('Logout error', err);
      });
    });
  </script>
