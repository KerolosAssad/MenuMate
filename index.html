<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuMate Login</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Main Styles -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Favicon (optional) -->
  <link rel="icon" href="assets/MenuMate_simplified_Logo.png" type="image/png">
</head>

<body class="gray-bg">

  <!-- Main Section -->
  <section class="section-padding2">
    <div class="container" style="max-width: 1100px; margin: 0 auto;">
      <div class="row" style="display: flex; align-items: center; flex-wrap: wrap;">

        <!-- Left Column: Images -->
        <div class="col-left animate__animated animate__fadeInUp" style="flex: 1; text-align: center;">
          <img src="assets/MenuMate_simplified_Logo.png" alt="MenuMate Logo" style="max-width: 220px; margin-bottom: 30px;">
          <img src="assets/cookattempt2.png" alt="Robot Chef" style="max-width: 100%; max-height: 340px;">
        </div>

        <!-- Right Column: Login Card -->
        <div class="col-right animate__animated animate__fadeInUp" style="flex: 1;">
          <div class="login-card" style="background: #fff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
            <h3 style="font-weight: 600; color: #0D210B; margin-bottom: 25px;">Welcome Back</h3>

            <form id="loginForm">
              <div style="margin-bottom: 20px;">
                <input type="email" id="email" placeholder="Email" required
                  style="width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Poppins', sans-serif;" />
              </div>

              <div style="margin-bottom: 20px;">
                <input type="password" id="password" placeholder="Password" required
                  style="width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Poppins', sans-serif;" />
              </div>

              <button type="submit" class="btn" style="width: 100%; margin-bottom: 15px;">Login</button>
            </form>

            <div style="text-align: center; margin: 20px 0; font-size: 14px; color: #666;">or</div>

            <a id="googleLoginBtn" class="boxed-btn" style="width: 100%; display: block; text-align: center; margin-bottom: 10px;">
              Login with Google
            </a>

            <p style="text-align: center; font-size: 14px; margin-top: 20px;">
              Don't have an account?
              <a href="MenuMate_Registration_Page_Main.html" class="theme-color" style="font-weight: 500; text-decoration: underline;">
                Sign Up
              </a>
            </p>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- JS Files -->
  <script src="config.js"></script>
  <script src="JS/auth.js"></script>
</body>
</html>
