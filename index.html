<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MenuMate – Login / Sign Up</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <h1 class="logo">
        <img src="simplified-logo.png" alt="MenuMate Logo" style="height: 40px;" />
      </h1>
      <nav>
        <ul class="nav-links">
          <li><a href="landing_page.html">Home</a></li>
          <li><a href="explorer.html">Explore</a></li>
          <li><a href="nutruian.html">Nutrition</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="auth-section">
    <div class="container auth-container">
      <h2>Login or Sign Up</h2>
      <form id="authForm" class="auth-form">
        <div class="form-group">
          <label for="name">Full Name (for sign-up)</label>
          <input type="text" id="name" name="name" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="loginBtn">Login</button>
          <button type="button" class="btn-secondary" id="signupBtn">Sign Up</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 MenuMate. All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/js/auth.js"></script>
</body>
</html>
