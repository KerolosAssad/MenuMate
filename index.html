<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuMate | Login</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

 <style>
  body {
    background-color: #C7E8CA;
    font-family: 'Oswald', sans-serif;
    margin: 0;
    padding: 0;
  }

  .header-container {
    background-color: #DF2E38;
    display: flex;
    align-items: center;
    padding: 10px 20px;
  }

  .header-logo {
    max-width: 80px;
    margin-right: 15px;
  }

  .login-section {
    display: flex;
    flex-direction: row;
    height: calc(100vh - 70px);
    overflow: hidden;
  }

  .login-image-container {
    flex: 1;
    background-color: #DDF7E3;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 1rem;
  }

  .login-image-container img {
    max-width: 90%;
    height: auto;
    object-fit: contain;
  }

  .form-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #C7E8CA;
    padding: 2rem;
  }

  .card {
    background-color: #5D9C59;
    border-radius: 20px;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    color: white;
  }

  .form-control {
    background-color: #DDF7E3;
    color: #333;
    border: 1px solid #ccc;
  }

  .form-control::placeholder {
    color: #888;
  }

  .form-control:focus {
    background-color: #fff;
    color: #000;
    box-shadow: none;
    border-color: #5D9C59;
  }

  .btn-login {
    background-color: #DF2E38;
    color: white;
    font-weight: bold;
  }

  .btn-login:hover {
    background-color: #b6222c;
  }

  .social-login a {
    background-color: white;
    color: #444;
    border: none;
    padding: 0.5rem 0.75rem;
    border-radius: 5px;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    text-decoration: none;
    transition: background-color 0.2s;
  }

  .social-login a:hover {
    background-color: #f0f0f0;
  }

  @media (max-width: 768px) {
    .login-section {
      flex-direction: column-reverse;
    }

    .login-image-container {
      display: none;
    }

    .form-wrapper {
      padding: 1rem;
    }
  }
</style>

<!-- Login Section -->
<div class="login-section">
  <!-- Left Image Column -->
  <div class="login-image-container">
    <img src="./assets/cookattempt2.png" alt="Chef holding login form" />
  </div>

  <!-- Right Form Column -->
  <div class="form-wrapper">
    <div class="card">
      <h3 class="text-center mb-4">Welcome Back</h3>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required />
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-login">Login</button>
        </div>
      </form>

      <hr />

      <div class="social-login d-flex justify-content-center mb-3">
        <a id="googleLoginBtn"><i class="fab fa-google"></i> Login with Google</a>
      </div>

      <p class="text-center">
        Don't have an account?
        <a href="https://kerolosassad.github.io/MenuMate/MenuMate_Registration_Page_Main.html" style="color: #DDF7E3;">Register here</a>
      </p>
    </div>
  </div>
</div>

      <!-- Image Column -->
      <div class="col-md-6 px-0">
        <img src="./assets/cookattempt2.png" alt="MenuMachine" class="login-image" />
      </div>
    </div>
  </div>

  <!-- ✅ Load config.js first -->
  <script src="config.js"></script>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Login Logic -->
  <script>
    // Dynamically set Google login link
    document.getElementById("googleLoginBtn").href = `${API_BASE_URL}/auth/google`;

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!loginForm.checkValidity()) {
        loginForm.classList.add('was-validated');
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const res = await fetch(`${API_BASE_URL}/api/login`, {
          method: "POST",
          credentials: "include",  // Important for cookie sessions
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          alert("✅ Login successful! Redirecting...");
          window.location.href = "https://kerolosassad.github.io/MenuMate/POC_Logging_info.html";
        } else {
          alert("❌ " + data.message);
        }
      } catch (err) {
        console.error("⚠️ Could not connect to backend:", err);
        alert("⚠️ Could not connect to backend.");
      }
    });
  </script>
</body>
</html>
