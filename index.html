<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuMate Login</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f9fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }

    /* Preloader */
    .preloader {
      background-color: #f9fafc;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0; left: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .preloader .loader {
      width: 60px;
      height: 60px;
      border: 5px solid #ddd;
      border-top-color: #5AAC4E;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: row;
      max-width: 900px;
      overflow: hidden;
      width: 100%;
      animation: fadeInUp 0.9s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-left {
      background-color: #f1f4fa;
      padding: 40px;
      flex: 1;
      text-align: center;
    }

    .login-left img {
      max-width: 80%;
      height: auto;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .login-right {
      padding: 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-right .logo {
      display: block;
      margin: 0 auto 30px;
      max-width: 180px;
    }

    .login-right h2 {
      font-size: 26px;
      margin-bottom: 10px;
      color: #0D210B;
      font-weight: 600;
    }

    .login-right form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .login-right input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .btn {
      background-color: #5AAC4E;
      border: none;
      color: #fff;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #469c3a;
    }

    .btn.secondary {
      background: #fff;
      color: #5AAC4E;
      border: 1px solid #5AAC4E;
    }

    .btn.secondary:hover {
      background-color: #5AAC4E;
      color: #fff;
    }

    .btn.google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
    }

    .note {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }

      .login-left, .login-right {
        padding: 30px;
      }

      .login-left img {
        max-width: 60%;
      }
    }
  </style>
</head>
<body>

  <div class="preloader" id="preloader">
    <div class="loader"></div>
  </div>

  <div class="login-container" style="display: none;" id="mainContent">
    <div class="login-left">
      <img src="assets/img/robotchef.png" alt="Chef Robot" />
    </div>
    <div class="login-right">
      <img src="assets/img/menumate-logo.png" alt="MenuMate Logo" class="logo" />
      <h2>Welcome Back</h2>
      <form id="authForm">
        <input type="text" id="name" placeholder="Name (for Sign Up)" />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />

        <button type="submit" class="btn">Login</button>
        <button type="button" id="signupBtn" class="btn secondary">Sign Up</button>
        <button type="button" class="btn google">
          <img src="assets/img/google-icon.png" alt="Google" style="width: 20px;" />
          Continue with Google
        </button>
      </form>
      <p class="note">Please sign up before logging in</p>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      document.getElementById('preloader').style.display = 'none';
      document.getElementById('mainContent').style.display = 'flex';
    });
  </script>

  <!-- Config first -->
  <script src="assets/js/config.js"></script>

  <!-- Auth logic -->
  <script src="assets/js/auth.js"></script>
</body>
</html>
