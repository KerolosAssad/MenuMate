<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuMate | Login</title>
  <link rel="shortcut icon" type="image/x-icon" href="assets/img/MenuMate_Logo.png" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f9fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }

    .preloader {
      background-color: #f9fafc;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0; left: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .preloader .loader {
      width: 60px;
      height: 60px;
      border: 5px solid #ddd;
      border-top-color: #5AAC4E;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: row;
      max-width: 900px;
      overflow: hidden;
      width: 100%;
      animation: fadeInUp 0.9s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-left {
      background-color: #f1f4fa;
      padding: 40px;
      flex: 1;
      text-align: center;
    }

    .login-left img {
      max-width: 80%;
      height: auto;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .login-right {
      padding: 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-right .logo {
      display: block;
      margin: 0 auto 30px;
      max-width: 180px;
    }

    .login-right h2 {
      font-size: 26px;
      margin-bottom: 10px;
      color: #0D210B;
      font-weight: 600;
    }

    .login-right form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .login-right input {
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .btn {
      background-color: #5AAC4E;
      border: none;
      color: #fff;
      padding: 14px;
      font-size: 17px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #469c3a;
    }

    .btn.google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
      background: #fff;
      color: #5AAC4E;
      border: 1px solid #5AAC4E;
    }

    .btn.google:hover {
      background-color: #5AAC4E;
      color: #fff;
    }

    .note {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: 10px;
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

  @media (max-width: 768px) {
  .login-container {
    flex-direction: column;
    margin: 20px;
  }

  .login-left, .login-right {
    padding: 20px;
  }

  .login-left img {
    max-width: 60%;
  }

  .login-right .logo {
    max-width: 140px;
    margin-bottom: 20px;
  }

  .login-right h2 {
    font-size: 22px;
  }
  }
    
    }
  </style>
</head>
<body>

  <div class="preloader" id="preloader">
    <div class="loader"></div>
  </div>

  <div class="login-container" style="display: none;" id="mainContent">
    <div class="login-left">
      <img src="assets/cookattempt2.png" alt="MenuMachine" />
    </div>
    <div class="login-right">
      <img src="assets/MenuMate_simplified_Logo.png" alt="MenuMate Logo" class="logo" />
      <h2>Welcome Back</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="btn">Login</button>
        <button type="button" id="googleLoginBtn" class="btn google">
          <img class="google-icon" src="assets/img/google-icon.png" alt="Google Logo" onerror="this.src='https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg'" />
          Continue with Google
        </button>
      </form>

      <p class="note">
        Don't have an account?
        <a href="https://kerolosassad.github.io/MenuMate/MenuMate_Registration_Page_Main.html" style="color: #5AAC4E;">Register here</a>
      </p>
    </div>
  </div>

  <!-- Preloader Script -->
  <script>
    window.addEventListener('load', () => {
      document.getElementById('preloader').style.display = 'none';
      document.getElementById('mainContent').style.display = 'flex';
    });
  </script>

  <!-- Config First -->
  <script src="config.js"></script>

  <!-- Auth Logic -->
  <script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const res = await fetch(`${API_BASE_URL}/api/login`, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          alert("Login successful! Redirecting...");
          window.location.href = "https://kerolosassad.github.io/MenuMate/MenuMate_LandingPage.html";
        } else {
          alert(data.message);
        }
      } catch (err) {
        console.error("Could not connect to backend:", err);
        alert("Could not connect to backend.");
      }
    });

    document.getElementById("googleLoginBtn").addEventListener("click", () => {
      window.location.href = `${API_BASE_URL}/auth/google`;
    });
  </script>
</body>
</html>
