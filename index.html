<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuMate | Login</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Style -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f7fd;
      margin: 0;
      padding: 0;
    }

    .preloader {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #f7f7fd;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preloader img {
      width: 80px;
      animation: rotate 1.2s linear infinite;
    }

    @keyframes rotate {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }

    .logo {
      max-height: 80px;
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      padding: 2rem;
    }

    .login-card {
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: row;
      max-width: 900px;
      width: 100%;
    }

    .login-card img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .login-left {
      background-color: #f1f4fa;
      flex: 1;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-right {
      flex: 1;
      padding: 2rem 3rem;
    }

    .login-right h3 {
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #0D210B;
    }

    .form-control {
      background-color: #f9f9ff;
      border-radius: 8px;
      padding: 12px 15px;
    }

    .btn-login {
      background-color: #5AAC4E;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
    }

    .btn-login:hover {
      background-color: #3d8b39;
    }

    .social-login a {
      background: #fff;
      color: #333;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 5px;
      font-weight: 500;
      border: 1px solid #ccc;
      text-decoration: none;
      margin-bottom: 1rem;
      transition: background 0.3s;
    }

    .social-login a:hover {
      background: #f1f1f1;
    }

    .register-link {
      margin-top: 1rem;
      text-align: center;
    }

    .register-link a {
      color: #5AAC4E;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .login-card {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <img src="assets/MenuMate_simplified_Logo.png" alt="Loading...">
  </div>

  <!-- Login Wrapper -->
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Left: Image -->
      <div class="login-left">
        <img src="assets/cookattempt2.png" alt="Chef Robot" />
      </div>

      <!-- Right: Login Form -->
      <div class="login-right">
        <div class="text-center mb-4">
          <img src="assets/MenuMate_simplified_Logo.png" class="logo" alt="MenuMate Logo" />
        </div>
        <h3 class="text-center">Login to MenuMate</h3>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Your password" required />
          </div>
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-login">Login</button>
          </div>
        </form>

        <div class="social-login text-center">
          <a id="googleLoginBtn"><i class="fab fa-google"></i> Login with Google</a>
        </div>

        <div class="register-link">
          Don't have an account? <a href="MenuMate_Registration_Page_Main.html">Register here</a>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Loading screen hide after window is ready
    window.addEventListener("load", function () {
      const preloader = document.getElementById("preloader");
      if (preloader) {
        preloader.style.display = "none";
      }
    });

    // Google Login button link
    document.getElementById("googleLoginBtn").addEventListener("click", () => {
      window.location.href = `${API_BASE_URL}/auth/google`;
    });

    // Manual login handler
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Please fill in both fields.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE_URL}/api/login`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        if (res.ok) {
          alert("✅ Login successful!");
          window.location.href = "POC_Logging_info.html";
        } else {
          alert("❌ " + (data.message || "Login failed"));
        }
      } catch (err) {
        alert("⚠️ Could not connect to backend.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
