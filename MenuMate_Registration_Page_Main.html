<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MenuMate Registration</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #2d6a4f;
      color: white;
      font-family: 'Oswald', sans-serif;
      padding: 2rem;
    }
    .form-control {
      background-color: #333;
      color: white;
      border: 1px solid #ccc;
    }
    .form-control::placeholder {
      color: #aaa;
    }
    .form-control:invalid {
      border-color: #dc3545;
    }
    .form-control:valid {
      border-color: #28a745;
    }
    .form-control:disabled {
      background-color: #666 !important; /* Light grey for disabled fields */
      color: #ccc !important;
      opacity: 1;
    }
    .form-section {
      margin-bottom: 1.5rem;
    }
    #passwordStrength {
      height: 5px;
      background-color: red;
      transition: width 0.3s ease-in-out, background-color 0.3s;
    }
    #passwordFeedback {
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4 text-center">MenuMate Registration</h1>

    <form id="registrationForm" novalidate>
      <!-- Name -->
      <div class="row mb-3">
        <div class="col">
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" class="form-control" required>
        </div>
        <div class="col">
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" class="form-control" required>
        </div>
      </div>

      <!-- Email -->
      <div class="form-section">
        <label for="email">Email *</label>
        <input type="email" id="email" class="form-control" required>
      </div>

      <!-- Password (will be hidden for Google users) -->
      <div class="form-section" id="passwordSection">
        <label for="password">Password *</label>
        <input type="password" id="password" class="form-control" required minlength="6">
        <div id="passwordStrength"></div>
        <div id="passwordFeedback"></div>
      </div>

      <!-- Date of Birth -->
      <div class="form-section">
        <label for="dob">Date of Birth *</label>
        <input type="date" id="dob" class="form-control" required>
      </div>

      <!-- Height and Weight -->
      <div class="row mb-3">
        <div class="col">
          <label for="heightFeet">Height *</label>
          <div class="row">
            <div class="col">
              <input type="number" id="heightFeet" class="form-control" placeholder="Feet" min="0" required>
            </div>
            <div class="col">
              <input type="number" id="heightInches" class="form-control" placeholder="Inches" min="0" max="11" required>
            </div>
          </div>
        </div>
        <div class="col">
          <label for="weightLbs">Weight (lbs) *</label>
          <input type="number" id="weightLbs" class="form-control" placeholder="150" min="0" required>
        </div>
      </div>

      <!-- Gender -->
      <div class="form-section">
        <label for="gender">Gender *</label>
        <select id="gender" class="form-control" required>
          <option selected disabled value="">Select gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Non-binary</option>
          <option>Prefer not to say</option>
        </select>
      </div>

      <!-- Activity Level -->
      <div class="form-section">
        <label for="activityLevel">Activity Level *</label>
        <select id="activityLevel" class="form-control" required>
          <option selected disabled value="">Select your activity level</option>
          <option>Sedentary (little or no exercise)</option>
          <option>Lightly active (1–3 days/week)</option>
          <option>Moderately active (3–5 days/week)</option>
          <option>Very active (6–7 days/week)</option>
          <option>Super active (intense daily training)</option>
        </select>
      </div>

      <!-- Dietary Goal -->
      <div class="form-section">
        <label for="dietaryGoal">Dietary Goal (Max 300 Characters)</label>
        <textarea id="dietaryGoal" class="form-control" rows="3" maxlength="300" placeholder="E.g., lose weight, gain muscle, improve energy..."></textarea>
      </div>

      <!-- Dietary Restrictions -->
      <div class="form-section">
        <label for="dietaryRestrictions">Dietary Restrictions or Preferences (Max 150 Characters)</label>
        <input type="text" id="dietaryRestrictions" class="form-control" maxlength="150" placeholder="e.g., Vegan, Gluten-free, Kosher">
      </div>

      <!-- ExperiencePass Opt-in -->
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="experiencePassCheck" checked>
        <label class="form-check-label" for="experiencePassCheck">
          Opt in for ExperiencePass
        </label>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-success w-100">Create an Account</button>
    </form>
  </div>

  <!-- ✅ Load config.js first -->
  <script src="config.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Registration Logic -->
  <script>
    const form = document.getElementById('registrationForm');
    const passwordSection = document.getElementById('passwordSection');
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('passwordStrength');
    const feedback = document.getElementById('passwordFeedback');

    // Update password strength meter
    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let strength = 0;
      if (val.length >= 6) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[\W]/.test(val)) strength++;

      const bars = ["25%", "50%", "75%", "100%"];
      const colors = ["red", "orange", "#ffc107", "#28a745"];
      const texts = ["Weak", "Moderate", "Good", "Strong"];

      strengthBar.style.width = bars[strength - 1] || "0";
      strengthBar.style.backgroundColor = colors[strength - 1] || "transparent";
      feedback.textContent = texts[strength - 1] || "";
    });

    // Detect if user came from Google login
    async function checkGoogleSignup() {
      const params = new URLSearchParams(window.location.search);
      const googleSignup = params.get('google_signup');

      if (googleSignup === 'true') {
        try {
          const res = await fetch(`${API_BASE_URL}/api/user`, {
            credentials: 'include'
          });
          const data = await res.json();
          if (data.logged_in) {
            document.getElementById('email').value = data.email;
            document.getElementById('email').disabled = true;
            passwordInput.value = "Google_OAuth_User";
            passwordInput.disabled = true;
            passwordSection.style.display = "none"; // 🧹 Hide password section completely
          }
        } catch (err) {
          console.error('Error fetching Google user info', err);
        }
      }
    }

    checkGoogleSignup();

    // Handle form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const data = {
        email: document.getElementById("email").value,
        password: passwordInput.value,
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        dob: document.getElementById("dob").value,
        heightFeet: document.getElementById("heightFeet").value,
        heightInches: document.getElementById("heightInches").value,
        weightLbs: document.getElementById("weightLbs").value,
        gender: document.getElementById("gender").value,
        activityLevel: document.getElementById("activityLevel").value,
        dietaryGoal: document.getElementById("dietaryGoal").value,
        dietaryRestrictions: document.getElementById("dietaryRestrictions").value,
        experiencePassOptIn: document.getElementById("experiencePassCheck").checked
      };

      try {
        const res = await fetch(`${API_BASE_URL}/api/register`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const resData = await res.json();
        if (res.ok) {
          alert("✅ Registration successful!");
          window.location.href = "https://kerolosassad.github.io/MenuMate/";
        } else {
          alert("❌ " + resData.message);
        }
      } catch (err) {
        alert("⚠️ Could not connect to backend.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
