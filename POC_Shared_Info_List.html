<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Experiences</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet" />

  <script src="config.js"></script>

  <style>
    body {
      background-color: #2d6a4f;
      color: white;
      font-family: 'Oswald', sans-serif;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }

    .shared-entry {
      background-color: #1b4332;
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
      transition: all 0.3s ease-in-out;
      cursor: pointer;
    }

    .shared-entry.expanded {
      background-color: #2f5f49;
    }

    .entry-details {
      display: none;
      margin-top: 1rem;
    }

    .shared-entry.expanded .entry-details {
      display: block;
    }

    .action-buttons {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
    }

    .btn-action {
      font-size: 0.9rem;
      padding: 0.3rem 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Shared Experiences With You</h1>
    </div>

    <div id="sharedContainer" class="mt-4"></div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS Logic -->
  <script>
    const container = document.getElementById('sharedContainer');
    let currentUserEmail = null;

    async function getCurrentUser() {
      const res = await fetch(`${API_BASE_URL}/api/user`, { credentials: "include" });
      const data = await res.json();
      return data.logged_in ? data.email : null;
    }

    async function sendLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(async (position) => {
        const { latitude, longitude } = position.coords;
        await fetch(`${API_BASE_URL}/api/track_location`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ latitude, longitude })
        });
      }, (err) => {
        console.warn("Geolocation not permitted.", err);
      });
    }

    async function toggleStar(email) {
      await fetch(`${API_BASE_URL}/api/shared/star`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      loadNearbyExperiences();
    }

    async function deleteShared(email) {
      await fetch(`${API_BASE_URL}/api/shared/delete`, {
        method: "POST",
        credentials: "include"
      });
      loadNearbyExperiences();
    }

    async function loadNearbyExperiences() {
      try {
        currentUserEmail = await getCurrentUser();
        if (!currentUserEmail) {
          container.innerHTML = "<p class='text-warning'>You must be logged in to view shared experiences.</p>";
          return;
        }

        await sendLocation();

        const res = await fetch(`${API_BASE_URL}/api/nearby_experiences`, { credentials: "include" });
        const nearby = await res.json();

        const filtered = nearby.filter(e => e.email !== currentUserEmail);
        const limited = filtered.slice(0, 10);

        if (!limited.length) {
          container.innerHTML = "<p class='text-center text-light'>No nearby shared experiences available right now.</p>";
          return;
        }

        container.innerHTML = "";

        limited.forEach(exp => {
          const name = exp.name || exp.email.split("@")[0];
          const isStarred = exp.starred;
          const card = document.createElement("div");
          card.className = "shared-entry";

          card.innerHTML = `
            <strong>${name}</strong>
            <div class="entry-details">
              <p><strong>Recipes:</strong> ${exp.recipes || "N/A"}</p>
              <p><strong>Achievements:</strong> ${exp.achievements || "N/A"}</p>
              <p><strong>Hobbies:</strong> ${exp.hobbies || "N/A"}</p>
              <div class="action-buttons">
                <button class="btn btn-sm btn-${isStarred ? 'warning' : 'outline-warning'} btn-action" onclick="toggleStar('${exp.email}')">
                  ${isStarred ? '★' : '☆'} Star
                </button>
                <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteShared('${exp.email}')">🗑 Delete</button>
              </div>
            </div>
          `;

          card.addEventListener("click", () => {
            card.classList.toggle("expanded");
          });

          container.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading nearby shared experiences:", err);
        container.innerHTML = "<p class='text-danger'>Unable to load experiences at this time.</p>";
      }
    }

    loadNearbyExperiences();
  </script>
</body>
</html>
