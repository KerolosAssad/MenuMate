<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Experiences</title>
  <link rel="shortcut icon" type="image/x-icon" href="assets/img/MenuMate_Logo.png" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script src="config.js"></script>

  <style>
    body {
      background-color: #f0fdf4;
      font-family: 'Poppins', sans-serif;
      padding: 2rem;
      color: #333;
    }

    h1 {
      color: #5AAC4E;
      font-weight: 600;
      text-align: center;
      margin-bottom: 2rem;
    }

    #statusMessage {
      text-align: center;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #444;
    }

    .shared-entry {
      background-color: #ffffff;
      color: #333;
      padding: 1.5rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, background-color 0.3s ease;
      cursor: pointer;
    }

    .shared-entry:hover {
      transform: scale(1.01);
    }

    .shared-entry.expanded {
      background-color: #e6f9e9;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .entry-details {
      display: none;
      margin-top: 1rem;
    }

    .shared-entry.expanded .entry-details {
      display: block;
    }

    .action-buttons {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-action {
      border: none;
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
      border-radius: 50rem;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .btn-starred {
      background-color: #5AAC4E;
      color: white;
    }

    .btn-starred:hover {
      background-color: #469c3a;
    }

    .btn-delete {
      background-color: #DF2E38;
      color: white;
    }

    .btn-delete:hover {
      background-color: #b6222c;
    }

    .entry-label {
      font-weight: 500;
      margin-bottom: 0.2rem;
    }

    @media (max-width: 576px) {
      .entry-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Shared Experiences Nearby</h1>
    <div id="statusMessage">Updating location and fetching shared experiences...</div>
    <div id="sharedContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const container = document.getElementById('sharedContainer');
    const statusMessage = document.getElementById('statusMessage');

    function showStatus(text, type = 'info') {
      statusMessage.textContent = text;
      statusMessage.style.color = type === 'error' ? '#DF2E38' : '#5AAC4E';
    }

    async function fetchSharedExperiences() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/shared_experiences`, { credentials: 'include' });
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          container.innerHTML = "<p class='text-center fw-bold' style='color: #5AAC4E;'>No shared experiences nearby right now.</p>";
          return;
        }

        container.innerHTML = '';

        data.forEach(exp => {
          const card = document.createElement('div');
          card.className = 'shared-entry';
          const name = exp.name || exp.email.split('@')[0];

          card.innerHTML = `
            <div class="entry-header">
              <span>${name}</span>
              <span>${exp.starred ? '★' : '☆'}</span>
            </div>
            <div class="entry-details">
              <p><span class="entry-label">Recipes:</span> ${exp.recipes || 'N/A'}</p>
              <p><span class="entry-label">Achievements:</span> ${exp.achievements || 'N/A'}</p>
              <p><span class="entry-label">Hobbies:</span> ${exp.hobbies || 'N/A'}</p>
              <div class="action-buttons">
                <button class="btn-action btn-starred" onclick="event.stopPropagation(); toggleStar('${exp.email}')">
                  ${exp.starred ? 'Unstar' : 'Save'}
                </button>
                <button class="btn-action btn-delete" onclick="event.stopPropagation(); deleteOneShared('${exp.email}')">
                  Delete
                </button>
              </div>
            </div>
          `;

          card.addEventListener('click', () => {
            card.classList.toggle('expanded');
          });

          container.appendChild(card);
        });
      } catch (error) {
        console.error('Error fetching shared experiences:', error);
        showStatus("Failed to load shared experiences.", 'error');
      }
    }

    async function toggleStar(senderEmail) {
      try {
        await fetch(`${API_BASE_URL}/api/shared/star`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: senderEmail })
        });
        showStatus("Updated starred status.");
        fetchSharedExperiences();
      } catch (error) {
        console.error('Error toggling star:', error);
        showStatus("Failed to update star.", 'error');
      }
    }

    async function deleteOneShared(senderEmail) {
      try {
        await fetch(`${API_BASE_URL}/api/shared/delete_one`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: senderEmail })
        });
        showStatus("Experience deleted.");
        fetchSharedExperiences();
      } catch (error) {
        console.error('Error deleting experience:', error);
        showStatus("Failed to delete experience.", 'error');
      }
    }

    async function sendLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(async (position) => {
        try {
          const { latitude, longitude } = position.coords;
          await fetch(`${API_BASE_URL}/api/track_location`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ latitude, longitude })
          });
          fetchSharedExperiences();
        } catch (error) {
          console.error('Error sending location:', error);
          showStatus("Location update failed.", 'error');
        }
      }, (error) => {
        console.warn('Geolocation denied.', error);
        showStatus("Location access is required for sharing.");
      });
    }

    setInterval(sendLocation, 30000);
    sendLocation();
  </script>
</body>
</html>
