<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Experiences</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    body {
      background-color: #2d6a4f;
      color: white;
      font-family: 'Oswald', sans-serif;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }

    .shared-entry {
      background-color: #1b4332;
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }

    .entry-details {
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Shared Experiences With You</h1>
    </div>

    <div id="sharedContainer" class="mt-4"></div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS Logic -->
  <script>
    const API_BASE = "https://fair-mice-battle.loca.lt"; // Replace with your current tunnel URL
    const container = document.getElementById('sharedContainer');

    let currentUserEmail = null;

    async function loadExperiences() {
      try {
        // Step 1: Get current user
        const userRes = await fetch(`${API_BASE}/api/user`, {
          credentials: "include"
        });
        const userData = await userRes.json();
        if (!userData.logged_in) {
          container.innerHTML = "<p class='text-warning'>You must be logged in to view shared experiences.</p>";
          return;
        }

        currentUserEmail = userData.email;

        // Step 2: Get all shared experiences
        const res = await fetch(`${API_BASE}/api/shared_experiences`);
        const allExperiences = await res.json();

        // Step 3: Filter out user's own shared experiences
        const filtered = allExperiences.filter(exp => exp.email !== currentUserEmail);

        if (filtered.length === 0) {
          container.innerHTML = "<p class='text-center text-light'>No experiences shared with you yet.</p>";
          return;
        }

        // Step 4: Display filtered results
        filtered.forEach(exp => {
          const name = exp.name || exp.email.split("@")[0];

          const card = document.createElement("div");
          card.className = "shared-entry";
          card.innerHTML = `
            <strong>${name}</strong>
            <div class="entry-details">
              <p><strong>Recipes:</strong> ${exp.recipes || "N/A"}</p>
              <p><strong>Achievements:</strong> ${exp.achievements || "N/A"}</p>
              <p><strong>Hobbies:</strong> ${exp.hobbies || "N/A"}</p>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error("Error loading shared experiences:", err);
        container.innerHTML = "<p class='text-danger'>Unable to load experiences at this time.</p>";
      }
    }

    loadExperiences();
  </script>
</body>
</html>
